<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Handshake official-style: bright lime rounded square + slanted navy H.
       Uniform skewX(-10) on a parent group so both legs share EXACTLY the same slant angle
       and are guaranteed parallel — no hand-built polygon drift. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#E6FF5A"/>

  <g transform="translate(16,18) skewX(-10)" fill="#0A2540">
    <!-- Left leg — thick rounded column, 92px tall so it almost fills the 128 viewBox -->
    <rect x="0"  y="0" width="24" height="92" rx="6"/>
    <!-- Right leg — identical geometry (parallel, same skew) -->
    <rect x="68" y="0" width="24" height="92" rx="6"/>
    <!-- Crossbar —  thick, positioned slightly above vertical midpoint (Handshake style)
         92 wide × 20 tall, so it fully connects both legs. -->
    <rect x="0"  y="34" width="92" height="20" rx="5"/>
  </g>
</svg>
