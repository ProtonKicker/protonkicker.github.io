<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- PrimeGrid official-style deep navy blue gradient pill background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0B1F5C"/>
    </linearGradient>
  </defs>

  <!-- Rounded pill-shaped background (matches official logo silhouette crop) -->
  <rect x="4" y="16" width="120" height="96" rx="26" fill="url(#bg)"/>

  <!-- P & G letters in PrimeGrid gold/yellow -->
  <g fill="#FFD84D">

    <!-- P letter — bold stem + rounded bowl with separate hole path (SVG nonzero winding rule) -->
    <path d="
      M 18 34
      L 46 34
      Q 62 34 62 50
      L 62 66
      Q 62 82 46 82
      L 32 82
      L 32 100
      L 18 100
      Z
      M 32 48
      L 32 68
      L 44 68
      Q 48 68 48 64
      L 48 52
      Q 48 48 44 48
      Z"/>

    <!-- G letter — outer rounded rectangle + inner cutout with bottom-right leg notch.
         Using fill-rule=evenodd so the inner subpath reliably punches the hole. -->
    <path fill-rule="evenodd" d="
      M 66 34
      L 106 34
      Q 116 34 116 44
      L 116 90
      Q 116 100 106 100
      L 66 100
      Q 56 100 56 90
      L 56 44
      Q 56 34 66 34
      Z
      M 78 48
      L 98 48
      Q 102 48 102 52
      L 102 72
      L 90 72
      L 90 78
      L 102 78
      L 102 86
      Q 102 88 98 88
      L 78 88
      Q 72 88 72 82
      L 72 54
      Q 72 48 78 48
      Z"/>
  </g>
</svg>
